<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X1 Gesture Control</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>X1 Gesture Control</h1>
    <div id="status" class="status">connecting&hellip;</div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Filter gestures&hellip;" autocomplete="off">
    <label class="speed">
      Speed <output id="speedOut">1.00&times;</output>
      <input id="speed" type="range" min="0.4" max="1.6" step="0.05" value="1">
    </label>
    <label class="toggle">
      <input id="head" type="checkbox" checked> Move head
    </label>
    <button id="stop" class="stop">Stop</button>
  </div>

  <p id="log" class="log">Pick a gesture to play it on the robot.</p>

  <main id="grid" class="grid"></main>

  <footer>
    <span id="counts"></span>
    <span class="hint">Greyed gestures are blocked by <code>laban/gesture_policy.py</code>; hover for the reason.</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
