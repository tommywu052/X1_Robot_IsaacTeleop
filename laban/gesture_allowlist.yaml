# X1 gesture allow-list -- measured on the robot's URDF, not hand-written.
#
# Two questions have to be answered separately, because either one alone gives a
# wrong list: can the IK solve this gesture, and does the solved pose put the arms
# inside each other? `thanks` is playable at full amplitude and still collides in
# 6 of its 8 keyframes.
#
# `gesture_policy.py` reads this file for the tiers. The block list is also
# compiled into that module, so the blocks survive this file going missing.

meta:
  measured_on: cam (WSL2 Ubuntu 24.04)
  measured_at: "2026-09-01"
  urdf: /home/tommywu/xiaobei_X1_ws/src/pkg_robot_model/urdf/pkg_robot_model.urdf
  srdf: /home/tommywu/xiaobei_X1_ws/src/pkg_robot_model_moveit_config/config/pkg_robot_model.srdf
  collision_pairs_after_srdf_filter: 169
  library_size: 92

# Why the tier boundary is 0.010 m and not 0.
#
# The shoulders carry a standing tracking error of 0.019 rad at the ready pose
# and 0.117 rad in a closed two-handed pose (see laban/README.md). Over the upper
# arm that is roughly 6-35 mm of positional
# error, so a computed clearance of 4 mm is not a clearance the hardware can be
# trusted to keep. Those gestures are recorded as `caution`, not as safe.
#
# They are not blocked: 0.004 m is what most head-only gestures measure, since
# the arms hold a single pose throughout, and blocking them would remove nod /
# shake head / laugh head, which the conversation path uses constantly and which
# have never been observed to touch. What the tier buys is that `caution`
# gestures stay out of ASPIRE's search space while remaining available to the
# human-driven chat path.
tiers:
  blocked: {max_gap_m: 0.0}
  caution: {max_gap_m: 0.010}
  ok: {}

policy:
  # The conversation path may use ok + caution.
  chat: [ok, caution]
  # The ASPIRE agent may only use `ok`. A skill learnt on a gesture whose
  # clearance sits inside the servo error is not a skill, it is a coin flip.
  aspire: [ok]
  # Nothing may use `blocked`, including a human typing a name into the UI.
  blocked_is_absolute: true

# 13 gestures. min_gap 0.000 m means the collision meshes interpenetrate.
blocked:
  bad:            {min_gap_m: 0.000, colliding_keyframes: 1}
  help4:          {min_gap_m: 0.000, colliding_keyframes: 2}
  howareyou4:     {min_gap_m: 0.000, colliding_keyframes: 2}
  please4:        {min_gap_m: 0.000, colliding_keyframes: 2}
  sorry:          {min_gap_m: 0.000, colliding_keyframes: 2}
  sorry2:         {min_gap_m: 0.000, colliding_keyframes: 3}
  thanks:         {min_gap_m: 0.000, colliding_keyframes: 6}
  think d high l: {min_gap_m: 0.000, colliding_keyframes: 2}
  think d high s: {min_gap_m: 0.000, colliding_keyframes: 2}
  think d low l:  {min_gap_m: 0.000, colliding_keyframes: 2}
  think d low s:  {min_gap_m: 0.000, colliding_keyframes: 2}
  tired:          {min_gap_m: 0.000, colliding_keyframes: 1}
  youandme4:      {min_gap_m: 0.000, colliding_keyframes: 1}

