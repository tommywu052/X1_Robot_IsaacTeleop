# Arms never change across keyframes. With the head disabled these are genuine
# no-ops that still report ok, which is the trap laban/README.md warns about: the
# player looks broken when it is doing exactly what it was asked.
head_only:   # 19
  - away4
  - beat rotate
  - contrast
  - deictic you rotate
  - laugh head
  - look at
  - nod
  - ok4
  - shake head
  - sleepy4
  - test
  - theme head down continue
  - theme head down end
  - theme head lean continue
  - theme head lean end
  - theme rotate continue
  - theme rotate end
  - theme still continue
  - theme still end

# The player retries at 0.85 / 0.70 / 0.55 / 0.40 and settles here;
# everything else plays at 1.00. Phase 1 note: `hello` is one of these, so
# the first task's gesture runs at 0.70 of the Laban amplitude by design.
reduced_amplitude:   # 5
  confuse r:    0.70
  goodbye:      0.70
  hello:        0.70
  interesting:  0.55
  robot d move: 0.85
